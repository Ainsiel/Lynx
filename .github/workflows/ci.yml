name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  test:
    name: Integration Tests
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lynx
          POSTGRES_PASSWORD: lynx
          POSTGRES_DB: lynx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lynx -d lynx"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://lynx:lynx@localhost:5432/lynx?schema=public
      REDIS_URL: redis://localhost:6379
      RABBITMQ_URL: amqp://localhost:5672
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm --filter @lynx/api test:e2e

  load:
    name: Load Tests (k6)
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lynx
          POSTGRES_PASSWORD: lynx
          POSTGRES_DB: lynx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lynx -d lynx"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://lynx:lynx@localhost:5432/lynx?schema=public
      REDIS_URL: redis://localhost:6379
      RABBITMQ_URL: amqp://localhost:5672
      JWT_SECRET: ci-test-secret
      PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - name: Start API
        run: pnpm --filter @lynx/api start:prod &
      - name: Wait for API
        run: npx wait-on http://localhost:3000/health --timeout 30000
      - uses: grafana/k6-action@v0.3.1
        with:
          filename: k6/redirect-spike.js
        env:
          BASE_URL: http://localhost:3000
      - uses: grafana/k6-action@v0.3.1
        with:
          filename: k6/create-slug.js
        env:
          BASE_URL: http://localhost:3000
